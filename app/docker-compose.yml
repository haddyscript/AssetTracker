services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    container_name: dotnet_sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "SqlServer@2025!"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
      - ./init-scripts:/docker-entrypoint-initdb.d
    restart: unless-stopped

  adminer:
    image: adminer
    container_name: adminer
    depends_on:
      - sqlserver
    ports:
      - "3000:8080"
    environment:
      ADMINER_DEFAULT_SERVER: sqlserver   # <-- key for internal network
    restart: unless-stopped

volumes:
  sqlserver_data:
